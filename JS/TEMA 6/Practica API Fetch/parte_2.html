<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List: Completed ✅</title>
    <style>
      /* AESTHETIC DARK MODE */
      body {
        font-family: "Consolas", "Monaco", monospace; /* Fuente tipo código */
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        border-bottom: 2px solid #00e676; /* Verde neón */
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      button {
        background-color: #00e676;
        color: #121212;
        border: none;
        padding: 15px 30px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        transition:
          transform 0.1s,
          box-shadow 0.2s;
        margin-bottom: 30px;
      }

      button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
      }

      /* Contenedor de la lista */
      #todo-container {
        width: 100%;
        max-width: 600px;
        background: #1e1e1e;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        max-height: 60vh; /* Altura máxima */
        overflow-y: auto; /* Scroll si hay muchas tareas */
        display: none; /* Oculto al principio */
      }

      /* Estilo de cada tarea */
      .task-item {
        background-color: #2c2c2c;
        margin-bottom: 10px;
        padding: 15px;
        border-left: 5px solid #00e676; /* Borde verde indicando "Hecho" */
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .task-title {
        font-size: 0.95rem;
      }

      .check-icon {
        color: #00e676;
        font-size: 1.2rem;
      }

      /* Scrollbar personalizada aesthetic */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #121212;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00e676;
      }
    </style>
  </head>
  <body>
    <h1>✅ Historial de Tareas</h1>
    <p>Solo vibes productivas. Mira todo lo que has terminado.</p>

    <button id="btn-load">Descargar Lista (Async/Await)</button>

    <div id="todo-container"></div>

    <script>
      const btnLoad = document.getElementById("btn-load");
      const container = document.getElementById("todo-container");

      // Función asíncrona (Async/Await)
      async function cargarToDos() {
        try {
          // Feedback visual de carga
          btnLoad.textContent = "Cargando datos...";
          btnLoad.disabled = true;

          // 1. PETICIÓN FETCH
          // Pedimos todas las tareas
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/todos",
          );

          // 2. CONVERSIÓN A JSON
          const todos = await response.json();

          // 3. FILTRADO (Solo las completadas)
          // Usamos .filter() para quedarnos solo con las que tienen completed: true
          const completedTodos = todos.filter(
            (tarea) => tarea.completed === true,
          );

          // Limpiamos el contenedor por si le das dos veces
          container.innerHTML = "";
          container.style.display = "block";

          // 4. RECORRER Y MOSTRAR (Renderizado)
          completedTodos.forEach((tarea) => {
            // Creamos el HTML de cada tarea usando Template Literals
            const tareaHTML = `
                        <div class="task-item">
                            <span class="task-title">#${tarea.id}: ${tarea.title}</span>
                            <span class="check-icon">✓</span>
                        </div>
                    `;
            // Lo añadimos al contenedor
            container.innerHTML += tareaHTML;
          });

          // Restauramos el botón
          btnLoad.textContent = "Refrescar Lista";
          btnLoad.disabled = false;
        } catch (error) {
          console.error("Error grave:", error);
          alert("Hubo un error al conectar con la API 💀");
          btnLoad.textContent = "Reintentar";
          btnLoad.disabled = false;
        }
      }

      // Event Listener
      btnLoad.addEventListener("click", cargarToDos);
    </script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería Interactiva jQuery</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background-color: #222;
        color: white;
        padding: 20px;
      }

      .galeria {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
        min-height: 250px;
        align-items: center;
      }

      .imagen-interactiva {
        width: 150px;
        aspect-ratio: 2/3;
        object-fit: cover;
        border: 3px solid #555;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .imagen-interactiva:hover {
        border-color: #f39c12;
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      }

      .controles button {
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
        margin: 5px;
        border: none;
        border-radius: 5px;
        background-color: #3498db;
        color: white;
      }
      .controles button:hover {
        background-color: #2980b9;
      }

      #mensaje-info {
        margin-top: 20px;
        padding: 10px;
        background-color: #333;
        border: 1px solid #555;
        display: inline-block;
        min-width: 300px;
        color: #f1c40f;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Galería de Eventos</h1>

    <div class="galeria">
      <img
        src="img/img1.webp"
        class="imagen-interactiva"
        id="img1"
        alt="Póster de Scarface"
      />
      <img
        src="img/img2.webp"
        class="imagen-interactiva"
        id="img2"
        alt="Póster de Fight Club"
      />
      <img
        src="img/img3.jpg"
        class="imagen-interactiva"
        id="img3"
        alt="Póster de Donnie Darko"
      />
    </div>

    <div id="mensaje-info">Esperando acción...</div>

    <br /><br />

    <div class="controles">
      <button id="btn-restaurar">Restaurar Tamaños</button>
      <button id="btn-rotar">Rotar Imágenes</button>
      <button id="btn-ocultar">Ocultar</button>
      <button id="btn-mostrar">Mostrar</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="parte_4.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Royale 🎰</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle, #1e3c1e 10%, #000000 90%); 
        }

        .casino-machine {
            background: #222;
            border: 4px solid #d4af37;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            width: 350px;
        }

        h1 { color: #d4af37; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; margin-bottom: 5px; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

        .slots-window {
            background: #fff;
            color: #000;
            font-size: 3rem;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 3px solid #555;
            letter-spacing: 10px;
            font-family: 'Segoe UI Emoji', sans-serif;
        }

        input {
            width: 70%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        button {
            background: linear-gradient(45deg, #d4af37, #f9e076);
            color: #222;
            border: none;
            padding: 12px 30px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        #resultado {
            margin-top: 15px;
            font-weight: bold;
            min-height: 50px;
        }

        .win { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        .lose { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="casino-machine">
        <h1>💸 Las Vegas Casino 💸</h1>
        <p>La casa (casi) nunca pierde.</p>
        
        <form id="casinoForm">
            <input type="text" id="jugador" placeholder="Nombre del Ludópata..."required>
            <br>
            <button type="submit">🎰 ALL IN</button>
        </form>

        <div class="slots-window" id="slotScreen">🍒 💎 7️⃣</div>

        <div id="resultado"></div>
    </div>

    <script>
        
        const form = document.getElementById('casinoForm');
        const slotsDiv = document.getElementById('slotScreen');
        const resultadoDiv = document.getElementById('resultado');
        const inputJugador = document.getElementById('jugador');

        // Los emojis posibles en la tragaperras
        const items = ['🍒', '🍋', '🍇', '💎', '7️⃣', '💀'];

        form.addEventListener('submit', (e) => {
            // Paramos la recarga de la pagina
            e.preventDefault();

            const nombre = inputJugador.value.trim() || "Anónimo";

            // Efecto visual de girar
            slotsDiv.textContent = "🎲 🎲 🎲";
            resultadoDiv.textContent = "Girando...";
            resultadoDiv.className = "";

           
            setTimeout(() => {
                // Generamos 3 símbolos aleatorios
                const slot1 = items[Math.floor(Math.random() * items.length)];
                const slot2 = items[Math.floor(Math.random() * items.length)];
                const slot3 = items[Math.floor(Math.random() * items.length)];

                slotsDiv.textContent = `${slot1} ${slot2} ${slot3}`;

                // Lógica de Ganar/Perder
                // Ganas si los 3 son iguales OR si sacas al menos dos diamantes/sietes
                if (slot1 === slot2 && slot2 === slot3) {
                    if (slot1 === '💀') {
                         // JACKPOT NEGATIVO
                        resultadoDiv.innerHTML = `RIP ${nombre}.<br>Has sacado triple calavera. Vas a morir`;
                        resultadoDiv.className = "lose";
                    } else {
                        // JACKPOT REAL
                        resultadoDiv.innerHTML = `¡JACKPOT, ${nombre}! 🤑<br>Hoy se cena langosta. STONKS 📈`;
                        resultadoDiv.className = "win";
                    }
                } else if (slot1 === slot2 || slot2 === slot3 || slot1 === slot3) {
                    // Casi gana (2 iguales)
                    resultadoDiv.innerHTML = `Uff, casi bro.<br>Te faltó poco. Mete otra moneda 🤡.`;
                    resultadoDiv.className = "lose";
                } else {
                    // Perdió todo
                    resultadoDiv.innerHTML = `Cagada.<br>La casa se queda tu dinero.📉`;
                    resultadoDiv.className = "lose";
                }

            }, 500)  // Simulamos tiempo de giro (500ms)
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.9em;
            margin-top: 5px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1em;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Registro de Usuario</h2>
        <form id="registroForm">
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
                <div class="error-message" id="errorNombre"></div>
            </div>

            <div class="form-group">
                <label for="edad">Edad (>= 18):</label>
                <input type="number" id="edad" name="edad" min="0">
                <div class="error-message" id="errorEdad"></div>
            </div>

            <div class="form-group">
                <label for="genero">Género:</label>
                <select id="genero" name="genero">
                    <option value="">-- Selecciona --</option>
                    <option value="f">Femenino</option>
                    <option value="m">Masculino</option>
                    <option value="o">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (ej: 600600600 ó +34600600600):</label>
                <input type="text" id="telefono" name="telefono">
                <div class="error-message" id="errorTelefono"></div>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail (ej: nombre@servidor.es):</label>
                <input type="email" id="email" name="email">
                <div class="error-message" id="errorEmail"></div>
            </div>

            <button type="submit">Enviar Registro</button>
        </form>
    </div>

    <script>
        // Obtener el formulario y los elementos de error
        const form = document.getElementById('registroForm');
        const errorNombre = document.getElementById('errorNombre');
        const errorEdad = document.getElementById('errorEdad');
        const errorTelefono = document.getElementById('errorTelefono');
        const errorEmail = document.getElementById('errorEmail');
        
        // Función principal de validación
        const validarFormulario = (event) => {
            event.preventDefault(); 
            
            // Limpiar errores anteriores
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            
            let esValido = true;
            
            // Obtener valores
            const nombre = document.getElementById('nombre').value.trim();
            const edad = parseInt(document.getElementById('edad').value, 10);
            const telefono = document.getElementById('telefono').value.trim();
            const email = document.getElementById('email').value.trim();

            // Validar Nombre
            if (nombre === '') {
                errorNombre.textContent = 'El nombre es obligatorio.';
                esValido = false;
            }

            // Validar Edad
            if (isNaN(edad) || edad < 18) {
                errorEdad.textContent = 'Debes ser mayor o igual a 18 años.';
                esValido = false;
            }

            // Validar Teléfono
            const telefonoRegEx = /^(?:\+34|0034)?\s?(\d{9})$/;
            if (telefono !== '' && !telefonoRegEx.test(telefono.replace(/\s/g, ''))) {
                 // Quitamos espacios por si acaso antes de validar
                errorTelefono.textContent = 'El formato del teléfono no es válido.';
                esValido = false;
            }

            // Validar E-mail
            const emailRegEx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; 
            if (email === '' || !emailRegEx.test(email)) {
                errorEmail.textContent = 'Introduce un formato de email válido (ej: nombre@servidor.es).';
                esValido = false;
            }


            // Resultado Final
            if (esValido) {
                alert('¡Formulario enviado correctamente!\nNombre: ' + nombre + '\nEdad: ' + edad + '\nTeléfono: ' + telefono + '\nEmail: ' + email);
                form.reset(); 
            }
        };


        form.addEventListener('submit', validarFormulario);
    </script>
</body>
</html>

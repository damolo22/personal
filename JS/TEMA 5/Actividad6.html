<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actividad 6 - Registro Pro</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 20px 0;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 500px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="number"],
      input[type="email"],
      input[type="password"],
      select,
      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      .error-message {
        color: #ff4d4d;
        font-size: 0.85em;
        margin-top: 5px;
        min-height: 1em;
      }
      .botones {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        flex: 1;
        font-size: 1em;
      }
      button[type="submit"] {
        background-color: #28a745;
        color: white;
      }
      button[type="submit"]:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      button[type="reset"] {
        background-color: #dc3545;
        color: white;
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .checkbox-group input {
        width: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Crear Cuenta</h2>
      <form id="registroForm">
        <div class="form-group">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" />
          <div class="error-message" id="errorNombre"></div>
        </div>

        <div class="form-group">
          <label for="ciudad">Ciudad</label>
          <input type="text" id="ciudad" />
        </div>

        <div class="form-group">
          <label for="pais">País</label>
          <input type="text" id="pais" />
        </div>

        <div class="form-group">
          <label for="foto">Foto de perfil</label>
          <input type="file" id="foto" accept="image/*" />
        </div>

        <div class="form-group">
          <label for="pass">Contraseña *</label>
          <input type="password" id="pass" />
          <div class="error-message" id="errorPass"></div>
        </div>

        <div class="form-group">
          <label for="pass2">Repetir Contraseña *</label>
          <input type="password" id="pass2" />
          <div class="error-message" id="errorPass2"></div>
        </div>

        <div class="form-group">
          <label id="labelCaptcha">¿Cuánto es X + Y? *</label>
          <input type="number" id="captchaInput" />
          <div class="error-message" id="errorCaptcha"></div>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="acepto" onchange="toggleBoton()" />
          <label for="acepto">Acepto las condiciones</label>
        </div>

        <div class="botones">
          <button type="submit" id="btnEnviar" disabled>Crear cuenta</button>
          <button type="reset" onclick="reiniciarFormulario()">
            Borrar datos
          </button>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById("registroForm");
      let num1, num2, resultadoCorrecto;

      // Generar al azar
      function generarCaptcha() {
        num1 = Math.floor(Math.random() * 10);
        num2 = Math.floor(Math.random() * 10);
        resultadoCorrecto = num1 + num2;
        document.getElementById(
          "labelCaptcha"
        ).innerText = `¿Cuánto es ${num1} + ${num2}? *`;
      }

      // Habilitar/Deshabilitar botón de envío
      function toggleBoton() {
        const check = document.getElementById("acepto");
        document.getElementById("btnEnviar").disabled = !check.checked;
      }

      function reiniciarFormulario() {
        document
          .querySelectorAll(".error-message")
          .forEach((el) => (el.textContent = ""));
        generarCaptcha();
        toggleBoton();
      }

      const validarFormulario = (event) => {
        event.preventDefault();
        let esValido = true;
        document
          .querySelectorAll(".error-message")
          .forEach((el) => (el.textContent = ""));

        const pass = document.getElementById("pass").value;
        const pass2 = document.getElementById("pass2").value;
        const passRegEx = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])[\w]{6,15}$/;

        if (!passRegEx.test(pass)) {
          document.getElementById("errorPass").textContent =
            "Mín. 6-15 carac., A-Z, a-z, 0-9 y _";
          esValido = false;
        }

        // Validar Repetición
        if (pass !== pass2 || pass2 === "") {
          document.getElementById("errorPass2").textContent =
            "Las contraseñas no coinciden.";
          esValido = false;
        }

        // Validar Captcha
        const captchaUser = parseInt(
          document.getElementById("captchaInput").value
        );
        if (captchaUser !== resultadoCorrecto) {
          document.getElementById("errorCaptcha").textContent =
            "Resultado incorrecto. ¿Eres un bot?";
          esValido = false;
        }

        if (esValido) {
          alert("¡Cuenta creada con éxito!");
          form.reset();
          reiniciarFormulario();
        }
      };

      form.addEventListener("submit", validarFormulario);

      // Carga inicial
      generarCaptcha();
    </script>
  </body>
</html>
